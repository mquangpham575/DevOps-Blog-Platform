stages:
  - validate
  - build
  - test
  - docker-build
  - scan
  - deploy

# --- Validation Stage ---
validate-pipeline:
  stage: validate
  image:
    name: alpine/git:latest
    entrypoint: [""]
  script:
    - echo "Pipeline syntax is valid"
    - echo "Commit SHA - $CI_COMMIT_SHORT_SHA"
    - echo "Branch - $CI_COMMIT_REF_NAME"
    - echo "Changes in this commit"
    - git diff --name-only $CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA || echo "Initial commit or no previous SHA"
  # Run on any pipeline targeting main (push, web trigger, API, etc.)
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- Change Detection Rules ---
.user-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.blog-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.file-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.frontend-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.customer-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

.interaction-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

variables:
  DOCKER_DRIVER: overlay2
  # Limit heap to prevent JVM from consuming all available RAM on shared runners
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Xmx768m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

# --- Templates (DRY Principle) ---
.backend_build_template: &backend_build_def
  image: public.ecr.aws/docker/library/maven:3.9.6-eclipse-temurin-17
  stage: build
  cache:
    # Per-service key: avoids cross-service cache conflicts and reduces archive size
    key: "maven-$SERVICE_DIR-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository/com/
      - .m2/repository/org/springframework/
    policy: pull-push
  script:
    - cd $SERVICE_DIR
    - mvn package -DskipTests -T 1C
    - mkdir -p ci-artifacts
    - cp target/*.jar ci-artifacts/
  artifacts:
    paths:
      - $SERVICE_DIR/ci-artifacts/*.jar
    expire_in: 1 day

.backend_test_template: &backend_test_def
  image: public.ecr.aws/docker/library/maven:3.9.6-eclipse-temurin-17
  stage: test
  cache:
    key: "maven-$SERVICE_DIR-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository/com/
      - .m2/repository/org/springframework/
    policy: pull
  script:
    - cd $SERVICE_DIR
    - mvn test -T 1C

.docker_build_template: &docker_build_def
  image: public.ecr.aws/docker/library/docker:24.0.5
  stage: docker-build
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    # Disable TLS to avoid "device or resource busy" and timeout on self-hosted runners
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - echo "Verifying build artifacts in $SERVICE_DIR/ci-artifacts..."
    - ls -R $SERVICE_DIR/ci-artifacts || echo "No artifacts found"
    - docker build -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest -f $SERVICE_DIR/Dockerfile $SERVICE_DIR
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest

# --- Build Stage ---
build-user-service:
  <<: *backend_build_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"

build-blog-service:
  <<: *backend_build_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"

build-file-service:
  <<: *backend_build_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"

build-customer-service:
  <<: *backend_build_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"

build-interaction-service:
  <<: *backend_build_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"

build-frontend:
  image: public.ecr.aws/docker/library/node:20-alpine
  stage: build
  extends: .frontend-rules
  # Isolated cache to avoid polluting Java/.m2 cache
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
    - mkdir -p ci-artifacts
    - cp -r dist/* ci-artifacts/
  artifacts:
    paths:
      - frontend/ci-artifacts/
    expire_in: 1 day

# --- Test Stage ---
test-user-service:
  <<: *backend_test_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"
  needs: ["build-user-service"]
  dependencies: []

test-blog-service:
  <<: *backend_test_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"
  needs: ["build-blog-service"]
  dependencies: []

test-file-service:
  <<: *backend_test_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"
  needs: ["build-file-service"]
  dependencies: []

test-customer-service:
  <<: *backend_test_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"
  needs: ["build-customer-service"]
  dependencies: []

test-interaction-service:
  <<: *backend_test_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"
  needs: ["build-interaction-service"]
  dependencies: []

test-frontend:
  image: public.ecr.aws/docker/library/node:20-alpine
  stage: test
  extends: .frontend-rules
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/
    policy: pull
  script:
    - cd frontend
    - npm run test --if-present || echo "No test script configured"
  needs: ["build-frontend"]
  dependencies: []

# --- Docker Build Stage ---
docker-user-service:
  <<: *docker_build_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"
    IMAGE_NAME: "user-service"
  needs: ["build-user-service"]
  dependencies: ["build-user-service"]

docker-blog-service:
  <<: *docker_build_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"
    IMAGE_NAME: "blog-service"
  needs: ["build-blog-service"]
  dependencies: ["build-blog-service"]

docker-file-service:
  <<: *docker_build_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"
    IMAGE_NAME: "file-service"
  needs: ["build-file-service"]
  dependencies: ["build-file-service"]

docker-customer-service:
  <<: *docker_build_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"
    IMAGE_NAME: "customer-service"
  needs: ["build-customer-service"]
  dependencies: ["build-customer-service"]

docker-interaction-service:
  <<: *docker_build_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"
    IMAGE_NAME: "interaction-service"
  needs: ["build-interaction-service"]
  dependencies: ["build-interaction-service"]

docker-frontend:
  <<: *docker_build_def
  extends: .frontend-rules
  variables:
    SERVICE_DIR: "frontend"
    IMAGE_NAME: "frontend"
  needs: ["build-frontend"]
  dependencies: ["build-frontend"]

# --- Security Scan (DevSecOps) ---
.scan_template:
  stage: scan
  image:
    name: public.ecr.aws/aquasecurity/trivy:0.69.3
    entrypoint: [""]
  variables:
    # Use the host-mounted shared volume path
    TRIVY_CACHE_DIR: "/opt/trivycache"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  # Authenticate against the private GitLab registry so Trivy can pull the image to scan
  before_script:
    - export TRIVY_USERNAME=$CI_REGISTRY_USER
    - export TRIVY_PASSWORD=$CI_REGISTRY_PASSWORD
  # We use host volume mount `/opt/trivycache` defined in runner config.toml
  # No GitLab-managed zip cache needed anymore
  cache: []
  timeout: 5m
  allow_failure: true

scan-user-service:
  extends: .scan_template
  needs: ["docker-user-service"]
  script:
    - trivy image --cache-dir $TRIVY_CACHE_DIR --scanners vuln --exit-code 0 --severity HIGH,CRITICAL --no-progress
        $CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA

scan-blog-service:
  extends: .scan_template
  needs: ["docker-blog-service"]
  script:
    - trivy image --cache-dir $TRIVY_CACHE_DIR --scanners vuln --exit-code 0 --severity HIGH,CRITICAL --no-progress
        $CI_REGISTRY_IMAGE/blog-service:$CI_COMMIT_SHORT_SHA

scan-file-service:
  extends: .scan_template
  needs: ["docker-file-service"]
  script:
    - trivy image --cache-dir $TRIVY_CACHE_DIR --scanners vuln --exit-code 0 --severity HIGH,CRITICAL --no-progress
        $CI_REGISTRY_IMAGE/file-service:$CI_COMMIT_SHORT_SHA

scan-customer-service:
  extends: .scan_template
  needs: ["docker-customer-service"]
  script:
    - trivy image --cache-dir $TRIVY_CACHE_DIR --scanners vuln --exit-code 0 --severity HIGH,CRITICAL --no-progress
        $CI_REGISTRY_IMAGE/customer-service:$CI_COMMIT_SHORT_SHA

scan-interaction-service:
  extends: .scan_template
  needs: ["docker-interaction-service"]
  script:
    - trivy image --cache-dir $TRIVY_CACHE_DIR --scanners vuln --exit-code 0 --severity HIGH,CRITICAL --no-progress
        $CI_REGISTRY_IMAGE/interaction-service:$CI_COMMIT_SHORT_SHA

scan-frontend:
  extends: .scan_template
  needs: ["docker-frontend"]
  script:
    - trivy image --cache-dir $TRIVY_CACHE_DIR --scanners vuln --exit-code 0 --severity HIGH,CRITICAL --no-progress
        $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA


# --- Deploy Stage (ArgoCD / GitOps Sync) ---
.deploy_template:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  resource_group: production-deploy
  # Rules defined here - avoids multi-extends merge issue with script validation
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - git config --global user.name "Gitlab CI"
    - git config --global user.email "ci@gitlab.com"
    - git config --global http.postBuffer 524288000
    - git remote set-url origin https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    # Install a pinned kustomize version to avoid unpredictable installs from HEAD of master
    - apk add --no-cache curl
    - curl -sLo /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
    - tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin/
    - chmod +x /usr/local/bin/kustomize
  script:
    - |
      PUSH_SUCCESS=false
      for i in $(seq 1 10); do
        git fetch origin main
        git checkout -f origin/main
        cd k8s/base
        kustomize edit set image $CI_REGISTRY_IMAGE/$SERVICE_NAME=$CI_REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA
        cd ../..
        git add k8s/base/kustomization.yaml
        if git diff --cached --quiet; then
          echo "No kustomization changes to commit, skipping deploy push."
          PUSH_SUCCESS=true
          break
        fi
        git commit -m "ci: update $SERVICE_NAME image tag to $CI_COMMIT_SHORT_SHA [skip ci]"
        if git push origin HEAD:main; then
          echo "Successfully pushed update for $SERVICE_NAME"
          PUSH_SUCCESS=true
          break
        fi
        echo "Push attempt $i failed, retrying..."
        sleep $((RANDOM % 5 + 2))
      done
      if [ "$PUSH_SUCCESS" = false ]; then
        echo "Failed to push updates after 10 attempts."
        exit 1
      fi

deploy-user-service:
  extends: .deploy_template
  variables:
    SERVICE_NAME: "user-service"
  needs:
    - test-user-service
    - docker-user-service
    - scan-user-service

deploy-blog-service:
  extends: .deploy_template
  variables:
    SERVICE_NAME: "blog-service"
  needs:
    - test-blog-service
    - docker-blog-service
    - scan-blog-service

deploy-file-service:
  extends: .deploy_template
  variables:
    SERVICE_NAME: "file-service"
  needs:
    - test-file-service
    - docker-file-service
    - scan-file-service

deploy-customer-service:
  extends: .deploy_template
  variables:
    SERVICE_NAME: "customer-service"
  needs:
    - test-customer-service
    - docker-customer-service
    - scan-customer-service

deploy-interaction-service:
  extends: .deploy_template
  variables:
    SERVICE_NAME: "interaction-service"
  needs:
    - test-interaction-service
    - docker-interaction-service
    - scan-interaction-service

deploy-frontend:
  extends: .deploy_template
  variables:
    SERVICE_NAME: "frontend"
  needs:
    - test-frontend
    - docker-frontend
    - scan-frontend
