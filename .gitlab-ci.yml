stages:
  - validate
  - build
  - docker-build
  - scan
  - deploy

default:
  tags:
    - sh-runner-devops2

# --- Validation Stage ---
validate-pipeline:
  stage: validate
  image:
    name: alpine/git:latest
    entrypoint: [""]
  script:
    - echo "Pipeline syntax is valid"
    - echo "Commit SHA - $CI_COMMIT_SHORT_SHA"
    - echo "Branch - $CI_COMMIT_REF_NAME"
    - echo "Changes in this commit"
    - git diff --name-only $CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA || echo "Initial commit or no previous SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- Change Detection Rules ---
.user-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/user-service/**/*
        - .gitlab-ci.yml

.blog-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/blog-service/**/*
        - .gitlab-ci.yml

.file-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/file-service/**/*
        - .gitlab-ci.yml

.frontend-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*
        - .gitlab-ci.yml

.customer-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/customer-service/**/*
        - .gitlab-ci.yml

.interaction-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/interaction-service/**/*
        - .gitlab-ci.yml

variables:
  GIT_DEPTH: "1"
  GIT_STRATEGY: clone
  DOCKER_DRIVER: overlay2
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Xmx768m -XX:+TieredCompilation -XX:TieredStopAtLevel=1"

# --- Templates (DRY Principle) ---
.backend_build_template: &backend_build_def
  image: public.ecr.aws/docker/library/maven:3.9.6-eclipse-temurin-17
  stage: build
  script:
    - cd $SERVICE_DIR
    - mvn package -T 1C
    - mkdir -p ci-artifacts
    - cp target/*.jar ci-artifacts/
  artifacts:
    paths:
      - $SERVICE_DIR/Dockerfile
      - $SERVICE_DIR/ci-artifacts/
    expire_in: 1 hr

.docker_build_template: &docker_build_def
  image: public.ecr.aws/docker/library/docker:24.0.5
  stage: docker-build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - echo "Verifying build artifacts in $SERVICE_DIR/ci-artifacts..."
    - ls -R $SERVICE_DIR/ci-artifacts || echo "No artifacts found"
    - docker build -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest -f $SERVICE_DIR/Dockerfile $SERVICE_DIR
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest

# --- Build Stage ---
build-user-service:
  <<: *backend_build_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"
  cache:
    - key: "maven-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
      paths:
        - .m2/repository/
      policy: pull-push

build-blog-service:
  <<: *backend_build_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"
  cache:
    - key: "maven-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
      paths:
        - .m2/repository/
      policy: pull-push

build-file-service:
  <<: *backend_build_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"
  cache:
    - key: "maven-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
      paths:
        - .m2/repository/
      policy: pull-push

build-customer-service:
  <<: *backend_build_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"
  cache:
    - key: "maven-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
      paths:
        - .m2/repository/
      policy: pull-push

build-interaction-service:
  <<: *backend_build_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"
  cache:
    - key: "maven-$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
      paths:
        - .m2/repository/
      policy: pull-push

build-frontend:
  image: public.ecr.aws/docker/library/node:20-alpine
  stage: build
  extends: .frontend-rules
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    - key: "node-$CI_COMMIT_REF_SLUG"
      paths:
        - .npm/
      policy: pull-push
  script:
    - cd frontend
    - npm ci
    - npm run test --if-present
    - npm run build
    - mkdir -p ci-artifacts
    - cp -r dist/* ci-artifacts/
  artifacts:
    paths:
      - frontend/Dockerfile
      - frontend/nginx.conf
      - frontend/ci-artifacts/
    expire_in: 1 hr

# --- Docker Build Stage ---
docker-user-service:
  <<: *docker_build_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"
    IMAGE_NAME: "user-service"
    GIT_STRATEGY: none
  needs: ["build-user-service"]
  dependencies: ["build-user-service"]

docker-blog-service:
  <<: *docker_build_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"
    IMAGE_NAME: "blog-service"
    GIT_STRATEGY: none
  needs: ["build-blog-service"]
  dependencies: ["build-blog-service"]

docker-file-service:
  <<: *docker_build_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"
    IMAGE_NAME: "file-service"
    GIT_STRATEGY: none
  needs: ["build-file-service"]
  dependencies: ["build-file-service"]

docker-customer-service:
  <<: *docker_build_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"
    IMAGE_NAME: "customer-service"
    GIT_STRATEGY: none
  needs: ["build-customer-service"]
  dependencies: ["build-customer-service"]

docker-interaction-service:
  <<: *docker_build_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"
    IMAGE_NAME: "interaction-service"
    GIT_STRATEGY: none
  needs: ["build-interaction-service"]
  dependencies: ["build-interaction-service"]

docker-frontend:
  <<: *docker_build_def
  extends: .frontend-rules
  variables:
    SERVICE_DIR: "frontend"
    IMAGE_NAME: "frontend"
    GIT_STRATEGY: none
  needs: ["build-frontend"]
  dependencies: ["build-frontend"]

# --- Security Scan (DevSecOps) ---
prepare-trivy-db:
  stage: docker-build
  image:
    name: alpine:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - echo "Skipping Trivy DB download to speed up CI pipeline"

.scan_template:
  stage: scan
  image:
    name: alpine:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "Skipping before_script"
  script:
    - echo "Skipping Trivy image scan to speed up CI pipeline"
  cache: []
  timeout: 10m
  allow_failure: true

scan-user-service:
  extends:
    - .scan_template
    - .user-service-rules
  needs: ["docker-user-service", "prepare-trivy-db"]
  variables:
    IMAGE_NAME: "user-service"

scan-blog-service:
  extends:
    - .scan_template
    - .blog-service-rules
  needs: ["docker-blog-service", "prepare-trivy-db"]
  variables:
    IMAGE_NAME: "blog-service"

scan-file-service:
  extends:
    - .scan_template
    - .file-service-rules
  needs: ["docker-file-service", "prepare-trivy-db"]
  variables:
    IMAGE_NAME: "file-service"

scan-customer-service:
  extends:
    - .scan_template
    - .customer-service-rules
  needs: ["docker-customer-service", "prepare-trivy-db"]
  variables:
    IMAGE_NAME: "customer-service"

scan-interaction-service:
  extends:
    - .scan_template
    - .interaction-service-rules
  needs: ["docker-interaction-service", "prepare-trivy-db"]
  variables:
    IMAGE_NAME: "interaction-service"

scan-frontend:
  extends:
    - .scan_template
    - .frontend-rules
  needs: ["docker-frontend", "prepare-trivy-db"]
  variables:
    IMAGE_NAME: "frontend"

# --- Deploy Stage (ArgoCD / GitOps Sync) ---
.deploy_template:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  resource_group: production-deploy
  before_script:
    - git config --global user.name "Gitlab CI"
    - git config --global user.email "ci@gitlab.com"
    - git config --global http.postBuffer 524288000
    - git remote set-url origin https://oauth2:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - apk add --no-cache curl
    - curl -sLo /tmp/kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz"
    - tar -xzf /tmp/kustomize.tar.gz -C /usr/local/bin/
    - chmod +x /usr/local/bin/kustomize
  script:
    - |
      PUSH_SUCCESS=false
      for i in $(seq 1 10); do
        git fetch origin main
        git checkout -f origin/main
        cd k8s/base
        kustomize edit set image $CI_REGISTRY_IMAGE/$SERVICE_NAME=$CI_REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA
        cd ../..
        git add k8s/base/kustomization.yaml
        if git diff --cached --quiet; then
          echo "No kustomization changes to commit, skipping deploy push."
          PUSH_SUCCESS=true
          break
        fi
        git commit -m "ci: update $SERVICE_NAME image tag to $CI_COMMIT_SHORT_SHA [skip ci]"
        if git push origin HEAD:main; then
          echo "Successfully pushed update for $SERVICE_NAME"
          PUSH_SUCCESS=true
          break
        fi
        echo "Push attempt $i failed, retrying..."
        sleep $((RANDOM % 5 + 2))
      done
      if [ "$PUSH_SUCCESS" = false ]; then
        echo "Failed to push updates after 10 attempts."
        exit 1
      fi

deploy-user-service:
  extends:
    - .deploy_template
    - .user-service-rules
  variables:
    SERVICE_NAME: "user-service"
  needs:
    - docker-user-service
    - scan-user-service

deploy-blog-service:
  extends:
    - .deploy_template
    - .blog-service-rules
  variables:
    SERVICE_NAME: "blog-service"
  needs:
    - docker-blog-service
    - scan-blog-service

deploy-file-service:
  extends:
    - .deploy_template
    - .file-service-rules
  variables:
    SERVICE_NAME: "file-service"
  needs:
    - docker-file-service
    - scan-file-service

deploy-customer-service:
  extends:
    - .deploy_template
    - .customer-service-rules
  variables:
    SERVICE_NAME: "customer-service"
  needs:
    - docker-customer-service
    - scan-customer-service

deploy-interaction-service:
  extends:
    - .deploy_template
    - .interaction-service-rules
  variables:
    SERVICE_NAME: "interaction-service"
  needs:
    - docker-interaction-service
    - scan-interaction-service

deploy-frontend:
  extends:
    - .deploy_template
    - .frontend-rules
  variables:
    SERVICE_NAME: "frontend"
  needs:
    - docker-frontend
    - scan-frontend
