stages:
  - validate
  - build
  - test
  - docker-build
  - scan
  - deploy

# --- Validation Stage (Always Runs) ---
validate-pipeline:
  stage: validate
  image: alpine:latest
  script:
    - echo "Pipeline syntax is valid"
    - echo "Commit SHA - $CI_COMMIT_SHORT_SHA"
    - echo "Branch - $CI_COMMIT_REF_NAME"
    - echo "Changes in this commit"
    - git diff --name-only $CI_COMMIT_BEFORE_SHA..$CI_COMMIT_SHA || echo "Initial commit or no previous SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"

# --- Change Detection Templates ---
# --- Change Detection Templates ---
.user-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/user-service/**/*

.blog-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/blog-service/**/*

.file-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/file-service/**/*

.frontend-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - frontend/**/*

.customer-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/customer-service/**/*

.interaction-service-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - backend/interaction-service/**/*

variables:
  DOCKER_DRIVER: overlay2
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

# --- Templates (DRY Principle) ---
.backend_build_template: &backend_build_def
  image: public.ecr.aws/docker/library/maven:3.9.6-eclipse-temurin-17
  stage: build
  script:
    - cd $SERVICE_DIR
    # Maven will now automatically use the path defined in MAVEN_OPTS
    - mvn package -DskipTests
  artifacts:
    paths:
      - $SERVICE_DIR/target/*.jar
    expire_in: 1 day

.backend_test_template: &backend_test_def
  image: public.ecr.aws/docker/library/maven:3.9.6-eclipse-temurin-17
  stage: test
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository/
    policy: pull
  script:
    - cd $SERVICE_DIR
    - mvn test -Dmaven.main.skip=true

.docker_build_template: &docker_build_def
  image: public.ecr.aws/docker/library/docker:24.0.5
  stage: docker-build
  services:
    - name: docker:24.0.5-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u $CI_REGISTRY_USER $CI_REGISTRY --password-stdin
  script:
    - docker build -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest -f $SERVICE_DIR/Dockerfile $SERVICE_DIR
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/$IMAGE_NAME:latest

# --- Build Stage ---
build-user-service:
  <<: *backend_build_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"

build-blog-service:
  <<: *backend_build_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"

build-file-service:
  <<: *backend_build_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"

build-customer-service:
  <<: *backend_build_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"

build-interaction-service:
  <<: *backend_build_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"

build-frontend:
  image: public.ecr.aws/docker/library/node:20-alpine
  stage: build
  extends: .frontend-rules
  # Frontend uses its own cache to avoid overwriting/conflicting with Java cache
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day

# --- Test Stage ---
test-user-service:
  <<: *backend_test_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"
  needs: ["build-user-service"]
  dependencies: []

test-blog-service:
  <<: *backend_test_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"
  needs: ["build-blog-service"]
  dependencies: []

test-file-service:
  <<: *backend_test_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"
  needs: ["build-file-service"]
  dependencies: []

test-customer-service:
  <<: *backend_test_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"
  needs: ["build-customer-service"]
  dependencies: []

test-interaction-service:
  <<: *backend_test_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"
  needs: ["build-interaction-service"]
  dependencies: []

test-frontend:
  image: public.ecr.aws/docker/library/node:20-alpine
  stage: test
  extends: .frontend-rules
  cache:
    key: "node-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules/
    policy: pull
  script:
    - cd frontend
    - if [ ! -d "node_modules" ]; then npm ci; fi
    - npm test --if-present || echo "Tests not configured yet"
  needs: ["build-frontend"]
  dependencies: []

# --- Docker Build Stage ---
docker-user-service:
  <<: *docker_build_def
  extends: .user-service-rules
  variables:
    SERVICE_DIR: "backend/user-service"
    IMAGE_NAME: "user-service"
  needs: ["build-user-service"]

docker-blog-service:
  <<: *docker_build_def
  extends: .blog-service-rules
  variables:
    SERVICE_DIR: "backend/blog-service"
    IMAGE_NAME: "blog-service"
  needs: ["build-blog-service"]

docker-file-service:
  <<: *docker_build_def
  extends: .file-service-rules
  variables:
    SERVICE_DIR: "backend/file-service"
    IMAGE_NAME: "file-service"
  needs: ["build-file-service"]

docker-customer-service:
  <<: *docker_build_def
  extends: .customer-service-rules
  variables:
    SERVICE_DIR: "backend/customer-service"
    IMAGE_NAME: "customer-service"
  needs: ["build-customer-service"]

docker-interaction-service:
  <<: *docker_build_def
  extends: .interaction-service-rules
  variables:
    SERVICE_DIR: "backend/interaction-service"
    IMAGE_NAME: "interaction-service"
  needs: ["build-interaction-service"]

docker-frontend:
  <<: *docker_build_def
  extends: .frontend-rules
  variables:
    SERVICE_DIR: "frontend"
    IMAGE_NAME: "frontend"
  needs: ["build-frontend"]

# --- Deploy Stage Template (ArgoCD / GitOps Sync) ---
.deploy_template:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  resource_group: production-deploy
  before_script:
    - git config --global user.name "Gitlab CI"
    - git config --global user.email "ci@gitlab.com"
    - git remote set-url origin https://oauth2:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git
    - # Install kustomize
    - apk add --no-cache curl
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
  script:
    - cd k8s/base
    - kustomize edit set image $CI_REGISTRY_IMAGE/$SERVICE_NAME=$CI_REGISTRY_IMAGE/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA
    - cd ../..
    - git add k8s/base/kustomization.yaml
    - git commit -m "Update $SERVICE_NAME image tag to $CI_COMMIT_SHORT_SHA [skip ci]" || echo "No changes to commit"
    - |
      for i in $(seq 1 5); do
        git pull --rebase origin main || true
        git push origin HEAD:main && break || sleep $((RANDOM % 5 + 1))
      done

deploy-user-service:
  extends:
    - .deploy_template
    - .user-service-rules
  variables:
    SERVICE_NAME: "user-service"
  needs:
    - test-user-service
    - docker-user-service
    - scan-user-service

deploy-blog-service:
  extends:
    - .deploy_template
    - .blog-service-rules
  variables:
    SERVICE_NAME: "blog-service"
  needs:
    - test-blog-service
    - docker-blog-service
    - scan-blog-service

deploy-file-service:
  extends:
    - .deploy_template
    - .file-service-rules
  variables:
    SERVICE_NAME: "file-service"
  needs:
    - test-file-service
    - docker-file-service
    - scan-file-service

deploy-customer-service:
  extends:
    - .deploy_template
    - .customer-service-rules
  variables:
    SERVICE_NAME: "customer-service"
  needs:
    - test-customer-service
    - docker-customer-service
    - scan-customer-service

deploy-interaction-service:
  extends:
    - .deploy_template
    - .interaction-service-rules
  variables:
    SERVICE_NAME: "interaction-service"
  needs:
    - test-interaction-service
    - docker-interaction-service
    - scan-interaction-service

deploy-frontend:
  extends:
    - .deploy_template
    - .frontend-rules
  variables:
    SERVICE_NAME: "frontend"
  needs:
    - test-frontend
    - docker-frontend
    - scan-frontend

# --- Security Scan (DevSecOps) ---
.scan_template:
  stage: scan
  image:
    name: public.ecr.aws/aquasecurity/trivy:0.69.3
    entrypoint: [""]
  allow_failure: true

scan-user-service:
  extends: [.scan_template, .user-service-rules]
  needs: ["docker-user-service"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/user-service:$CI_COMMIT_SHORT_SHA

scan-blog-service:
  extends: [.scan_template, .blog-service-rules]
  needs: ["docker-blog-service"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/blog-service:$CI_COMMIT_SHORT_SHA

scan-file-service:
  extends: [.scan_template, .file-service-rules]
  needs: ["docker-file-service"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/file-service:$CI_COMMIT_SHORT_SHA

scan-customer-service:
  extends: [.scan_template, .customer-service-rules]
  needs: ["docker-customer-service"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/customer-service:$CI_COMMIT_SHORT_SHA

scan-interaction-service:
  extends: [.scan_template, .interaction-service-rules]
  needs: ["docker-interaction-service"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/interaction-service:$CI_COMMIT_SHORT_SHA

scan-frontend:
  extends: [.scan_template, .frontend-rules]
  needs: ["docker-frontend"]
  script:
    - trivy image --exit-code 0 --severity HIGH,CRITICAL $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
