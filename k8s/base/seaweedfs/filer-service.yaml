apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: blog-app
  labels:
    app: seaweedfs-filer
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8888
      targetPort: 8888
    - name: grpc
      port: 18888
      targetPort: 18888
  selector:
    app: seaweedfs-filer
