apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-volume
  namespace: blog-app
  labels:
    app: seaweedfs-volume
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 18080
      targetPort: 18080
  selector:
    app: seaweedfs-volume
